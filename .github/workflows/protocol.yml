name: Protocol tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/bootstrap_upstreams.ps1",
            "scripts/build_engine.ps1",
            "scripts/validate_v1.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Verify upstream submodule pins
        shell: pwsh
        run: .\scripts\bootstrap_upstreams.ps1
